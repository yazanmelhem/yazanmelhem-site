# إعدادات لوحة التحرير (Pages CMS) — app.pagescms.org
media: media

content:
  - name: videos
    label: أعمال مرئية
    type: file
    path: videos.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{fields.ar}"
    fields:
      - name: ar
        label: العنوان بالعربية
        type: string
        required: true
      - name: en
        label: العنوان بالإنجليزية
        type: string
        required: true
      - name: id
        label: رابط يوتيوب أو معرّف الفيديو
        type: string
        required: true
        description: "الصق الرابط كاملًا (https://www.youtube.com/watch?v=...) أو المعرّف وحده. الغلاف يُجلب تلقائيًا."
      - name: kAr
        label: النوع بالعربية
        type: string
        description: "فيلم وثائقي  أو  فيديو شرح"
      - name: kEn
        label: النوع بالإنجليزية
        type: string
        description: "Documentary  or  Explainer"
      - name: y
        label: السنة
        type: number
      - name: d
        label: المدة
        type: string
        description: "مثال: 5:12"

  - name: writing
    label: مواد مكتوبة
    type: file
    path: writing.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{fields.ar}"
    fields:
      - name: ar
        label: العنوان بالعربية
        type: string
        required: true
      - name: en
        label: العنوان بالإنجليزية
        type: string
        required: true
      - name: u
        label: الرابط
        type: string
        required: true
      - name: kAr
        label: نوع المادة بالعربية
        type: string
        description: "مثال: تقرير بحثي"
      - name: kEn
        label: نوع المادة بالإنجليزية
        type: string
        description: "example: Research report"
      - name: y
        label: السنة
        type: number

  - name: archive
    label: الأرشيف الكامل
    type: file
    path: archive.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{fields.ar}"
    fields:
      - name: ar
        label: اسم المجموعة بالعربية
        type: string
        required: true
      - name: en
        label: اسم المجموعة بالإنجليزية
        type: string
        required: true
      - name: items
        label: الأعمال
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.ar}"
        fields:
          - name: ar
            label: العنوان بالعربية
            type: string
            required: true
          - name: en
            label: العنوان بالإنجليزية
            type: string
            required: true
          - name: y
            label: السنة
            type: number
          - name: u
            label: الرابط
            type: string
            required: true

  - name: site
    label: نصوص الصفحة
    type: file
    path: site.json
    format: json
    fields:
      - name: nameAr
        label: الاسم بالعربية
        type: string
      - name: nameEn
        label: الاسم بالإنجليزية
        type: string
      - name: roleAr
        label: الصفة بالعربية
        type: string
      - name: roleEn
        label: الصفة بالإنجليزية
        type: string
      - name: bioAr
        label: النبذة بالعربية
        type: text
      - name: bioEn
        label: النبذة بالإنجليزية
        type: text
      - name: metaAr
        label: سطر التعريف بالعربية
        type: string
        list: true
      - name: metaEn
        label: سطر التعريف بالإنجليزية
        type: string
        list: true
        description: "يجب أن يطابق ترتيب السطر العربي وعدده"
      - name: videoNoteAr
        label: سطر الدور تحت «أعمال مرئية» بالعربية
        type: text
      - name: videoNoteEn
        label: سطر الدور تحت «أعمال مرئية» بالإنجليزية
        type: text
      - name: email
        label: البريد الإلكتروني
        type: string
      - name: authorUrl
        label: رابط صفحة الكاتب في حبر
        type: string
      - name: cvUrl
        label: رابط السيرة الذاتية
        type: string
      - name: year
        label: سنة حقوق النشر
        type: string
