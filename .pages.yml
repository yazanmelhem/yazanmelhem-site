# إعدادات لوحة التحرير (Pages CMS) — app.pagescms.org
media:
  input: media
  output: /media
  categories: [image]

content:
  - name: services
    label: الخدمات
    type: file
    path: services.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{fields.ar}"
    fields:
      - name: ar
        label: اسم الخدمة بالعربية
        type: string
        required: true
      - name: en
        label: اسم الخدمة بالإنجليزية
        type: string
        required: true
      - name: bodyAr
        label: الوصف بالعربية
        type: text
      - name: bodyEn
        label: الوصف بالإنجليزية
        type: text
      - name: credits
        label: أعمال تشهد للخدمة
        type: object
        list: true
        fields:
          - name: ar
            label: بالعربية
            type: text
          - name: en
            label: بالإنجليزية
            type: text

  - name: videos
    label: أعمال مرئية
    type: file
    path: videos.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{fields.ar}"
    fields:
      - name: ar
        label: العنوان بالعربية
        type: string
        required: true
      - name: en
        label: العنوان بالإنجليزية
        type: string
        required: true
      - name: id
        label: رابط يوتيوب أو معرّف الفيديو
        type: string
        required: true
        description: "الصق الرابط كاملًا (https://www.youtube.com/watch?v=...) أو المعرّف وحده. الغلاف يُجلب تلقائيًا."
      - name: kAr
        label: النوع بالعربية
        type: string
        description: "فيلم وثائقي  أو  فيديو شرح"
      - name: kEn
        label: النوع بالإنجليزية
        type: string
        description: "Documentary  or  Explainer"
      - name: y
        label: السنة
        type: number
      - name: d
        label: المدة
        type: string
        description: "مثال: 5:12"
      - name: noteAr
        label: سطر وصف بالعربية
        type: text
        description: "اختياري. يظهر تحت أول فيلم في القائمة فقط، وهو الفيلم البارز."
      - name: noteEn
        label: سطر وصف بالإنجليزية
        type: text
      - name: cover
        label: غلاف مخصّص
        type: image
        description: "اختياري. لقطة تختارها من الفيلم تحلّ محلّ الغلاف التلقائي من يوتيوب. صدّرها بعرض 1600 بكسل تقريبًا."


  - name: writing
    label: مواد مكتوبة
    type: file
    path: writing.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{fields.ar}"
    fields:
      - name: ar
        label: العنوان بالعربية
        type: string
        required: true
      - name: en
        label: العنوان بالإنجليزية
        type: string
        required: true
      - name: u
        label: الرابط
        type: string
        required: true
      - name: kAr
        label: نوع المادة بالعربية
        type: string
        description: "مثال: تقرير بحثي"
      - name: kEn
        label: نوع المادة بالإنجليزية
        type: string
        description: "example: Research report"
      - name: y
        label: السنة
        type: number
      - name: srcAr
        label: الجهة الناشرة بالعربية
        type: string
        description: "مثال: حبر"
      - name: srcEn
        label: الجهة الناشرة بالإنجليزية
        type: string
      - name: image
        label: صورة مصغّرة
        type: image
        description: "اختياري. تظهر بجانب العنوان."

  - name: others
    label: بودكاست وتلفزيون
    type: file
    path: others.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{fields.ar}"
    fields:
      - {name: ar, label: العنوان بالعربية, type: string, required: true}
      - {name: en, label: العنوان بالإنجليزية, type: string}
      - {name: outAr, label: "الجهة والنوع بالعربية (مثال: صوت · بودكاست)", type: string}
      - {name: outEn, label: الجهة والنوع بالإنجليزية, type: string}
      - {name: y, label: السنة أو الفترة, type: string}
      - {name: bodyAr, label: دوري بالعربية, type: text}
      - {name: bodyEn, label: دوري بالإنجليزية, type: text}
      - {name: u, label: الرابط, type: string, description: "اختياري. إن تُرك فارغًا لا يظهر رابط."}
      - {name: linkAr, label: نص الرابط بالعربية, type: string}
      - {name: linkEn, label: نص الرابط بالإنجليزية, type: string}

  - name: field
    label: من الميدان (صور)
    type: file
    path: field.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{fields.ar}"
    fields:
      - {name: image, label: الصورة, type: image, required: true, description: "الصورة الأولى تظهر كبيرة. عرض 1200–1600 بكسل يكفي."}
      - {name: ar, label: الوصف بالعربية (المكان والسنة), type: string}
      - {name: en, label: الوصف بالإنجليزية, type: string}

  - name: archive
    label: الأرشيف الكامل
    type: file
    path: archive.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{fields.ar}"
    fields:
      - name: ar
        label: اسم المجموعة بالعربية
        type: string
        required: true
      - name: en
        label: اسم المجموعة بالإنجليزية
        type: string
        required: true
      - name: items
        label: الأعمال
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.ar}"
        fields:
          - name: ar
            label: العنوان بالعربية
            type: string
            required: true
          - name: en
            label: العنوان بالإنجليزية
            type: string
            required: true
          - name: y
            label: السنة
            type: number
          - name: u
            label: الرابط
            type: string
            required: true

  - name: site
    label: نصوص الصفحة
    type: file
    path: site.json
    format: json
    fields:
      - name: nameAr
        label: الاسم بالعربية
        type: string
      - name: nameEn
        label: الاسم بالإنجليزية
        type: string
      - name: roleAr
        label: الصفة بالعربية
        type: string
      - name: roleEn
        label: الصفة بالإنجليزية
        type: string
      - name: role2Ar
        label: السطر الثاني من الصفة بالعربية
        type: string
      - name: role2En
        label: السطر الثاني من الصفة بالإنجليزية
        type: string
      - name: bioAr
        label: النبذة بالعربية
        type: text
      - name: bioEn
        label: النبذة بالإنجليزية
        type: text
        type: string
        list: true
        description: "يجب أن يطابق ترتيب السطر العربي وعدده"
      - name: ctaAr
        label: نص زر التواصل بالعربية
        type: string
      - name: ctaEn
        label: نص زر التواصل بالإنجليزية
        type: string
      - name: contactAr
        label: سطر الدعوة في قسم التواصل بالعربية
        type: text
      - name: contactEn
        label: سطر الدعوة في قسم التواصل بالإنجليزية
        type: text
      - name: clientsAr
        label: جهات عملت معها بالعربية
        type: string
        list: true
      - name: clientsEn
        label: جهات عملت معها بالإنجليزية
        type: string
        list: true
        description: "يجب أن يطابق ترتيب القائمة العربية وعددها"
      - name: project
        label: مشروع قيد الإنتاج
        type: object
        description: "يظهر القسم فقط حين يُملأ العنوان بالعربية."
        fields:
          - name: titleAr
            label: العنوان بالعربية
            type: string
          - name: titleEn
            label: العنوان بالإنجليزية
            type: string
          - name: statusAr
            label: الحالة بالعربية
            type: string
          - name: statusEn
            label: الحالة بالإنجليزية
            type: string
          - {name: creditsAr, label: صنّاع الفيلم بالعربية, type: string}
          - {name: creditsEn, label: صنّاع الفيلم بالإنجليزية, type: string}
          - {name: grantAr, label: الدعم أو المنحة بالعربية, type: string}
          - {name: grantEn, label: الدعم أو المنحة بالإنجليزية, type: string}
          - name: textAr
            label: الوصف بالعربية
            type: text
          - name: textEn
            label: الوصف بالإنجليزية
            type: text
          - name: trailer
            label: رابط التريلر على يوتيوب
            type: string
          - name: image
            label: صورة
            type: image
      - name: videoNoteAr
        label: سطر الدور تحت «أعمال مرئية» بالعربية
        type: text
      - name: videoNoteEn
        label: سطر الدور تحت «أعمال مرئية» بالإنجليزية
        type: text
      - name: email
        label: البريد الإلكتروني
        type: string
      - name: authorUrl
        label: رابط صفحة الكاتب في حبر
        type: string
      - name: linkedin
        label: رابط LinkedIn
        type: string
        description: "اختياري. يظهر في قسم التواصل حين يُملأ."
      - name: whatsapp
        label: رقم واتساب
        type: string
        description: "اختياري، بالصيغة الدولية مثل +962 7X XXX XXXX. يظهر في قسم التواصل حين يُملأ."
      - name: cvUrl
        label: رابط السيرة الذاتية
        type: string
      - name: year
        label: سنة حقوق النشر
        type: string
      - name: portrait
        label: صورة شخصية
        type: image
        description: "تظهر في قسم التواصل. عمودية يفضّل، 1000 بكسل."
      - name: heroCaptionAr
        label: وصف صورة الترويسة بالعربية
        type: string
      - name: heroCaptionEn
        label: وصف صورة الترويسة بالإنجليزية
        type: string
      - name: heroImage
        label: صورة الترويسة
        type: image
        description: "صورة عريضة بملء الشاشة فوق الاسم. عرض 2000 بكسل تقريبًا."
      - name: design
        label: التصميم
        type: object
        fields:
          - name: font
            label: الخط
            type: select
            options:
              values: [IBM Plex Sans Arabic, Noto Kufi Arabic, Cairo, Tajawal]
